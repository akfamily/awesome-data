name: Pages

# 把 README.md / README.en.md 生成静态页面，发布到 https://akhub.akfamily.xyz/
on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.en.md
      - .github/scripts/build_site.py
      - .github/scripts/requirements-site.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r .github/scripts/requirements-site.txt
      - run: python .github/scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
